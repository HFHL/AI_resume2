<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Resume OCR/Parse Reviewer</title>
  <style>
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, 'Noto Sans', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif; margin: 0; }
    header { display: flex; align-items: center; gap: 12px; padding: 10px 16px; border-bottom: 1px solid #eee; position: sticky; top: 0; background: #fff; z-index: 10; }
    #list { width: 200px; border-right: 1px solid #eee; overflow: auto; height: calc(100vh - 52px); }
    #main { flex: 1; display: grid; grid-template-columns: 1.2fr 1fr; grid-template-rows: 3fr 0.6fr; gap: 10px; padding: 10px; height: calc(100vh - 52px); overflow: auto; }
    .row { display: flex; min-height: calc(100vh - 52px); }
    .card { border: 1px solid #eee; border-radius: 6px; overflow: hidden; display: flex; flex-direction: column; background: #fff; }
    .card.hfull { grid-row: 1 / span 2; }
    .card h3 { margin: 0; padding: 8px 10px; font-size: 13px; background: #f7f7f7; border-bottom: 1px solid #eee; }
    .card .content { padding: 10px; overflow: auto; }
    .content.pre { white-space: pre-wrap; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; font-size: 12px; }
    .item { padding: 6px 8px; cursor: pointer; border-bottom: 1px solid #f5f5f5; font-size: 12px; }
    .item:hover { background: #f0f7ff; }
    .item.active { background: #e6f0ff; }
    .toolbar { display: flex; align-items: center; gap: 8px; }
    button { padding: 6px 10px; font-size: 12px; }
    input, select { padding: 6px; font-size: 12px; }
    iframe { width: 100%; height: 100%; border: 0; background: #fafafa; }
    .pdf { height: calc(100% - 0px); }
    /* Markdown styles */
    .markdown { color: #222; line-height: 1.7; font-size: 15px; }
    .markdown h1, .markdown h2, .markdown h3, .markdown h4 { margin: 0.6em 0 0.3em; line-height: 1.25; }
    .markdown h1 { font-size: 1.3em; border-bottom: 1px solid #eee; padding-bottom: 4px; }
    .markdown h2 { font-size: 1.15em; border-bottom: 1px solid #f0f0f0; padding-bottom: 3px; }
    .markdown h3 { font-size: 1.05em; }
    .markdown p { margin: 0.5em 0; }
    .markdown ul, .markdown ol { padding-left: 1.2em; margin: 0.4em 0; }
    .markdown code { background: #f6f8fa; padding: 2px 4px; border-radius: 3px; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; font-size: 12px; }
    .markdown pre code { display: block; padding: 8px; overflow: auto; }
    .markdown table { border-collapse: collapse; margin: 8px 0; width: 100%; }
    .markdown th, .markdown td { border: 1px solid #eee; padding: 6px 8px; text-align: left; }
    .markdown blockquote { margin: 6px 0; padding: 6px 10px; border-left: 3px solid #ddd; background: #fafafa; color: #555; }
    /* Parsed Results styles */
    .parsed { font-size: 12px; line-height: 1.4; }
    .kv { display: grid; grid-template-columns: 100px 1fr; gap: 4px 8px; font-size: 12px; }
    .kv .k { color: #666; }
    .chips { display: flex; flex-wrap: wrap; gap: 4px; }
    .chip { background: #f0f4ff; color: #335; padding: 1px 6px; border-radius: 999px; font-size: 11px; border: 1px solid #e0e6ff; }
    .list { margin: 4px 0; padding-left: 14px; }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>
  <header>
    <div class="toolbar">
      <button id="refresh">Refresh Index</button>
      <label>Filter
        <select id="filter">
          <option value="all">All</option>
          <option value="need_translate">⚠️ 需要翻译</option>
          <option value="nojson">No JSON</option>
          <option value="noocr">No OCR MD</option>
          <option value="haszh">Has Translated MD</option>
        </select>
      </label>
      <button id="exportIssues">Export Issues JSON</button>
      <input id="importIssues" type="file" accept="application/json" />
    </div>
  </header>
  <div class="row">
    <div id="list"></div>
    <div id="main">
      <div class="card hfull">
        <h3>PDF</h3>
        <div class="content pdf"><iframe id="pdfFrame"></iframe></div>
        <div style="padding:8px; display:flex; gap:8px;">
          <button data-issue="pdf-mismatch">Mark: PDF mismatch</button>
        </div>
      </div>
      <div class="card">
        <h3>Markdown <span id="mdStatus"></span></h3>
        <div class="content markdown" id="mdBox"></div>
        <div style="padding:8px; display:flex; gap:8px; flex-wrap:wrap; align-items:center;">
          <button data-issue="md-bad-ocr">Mark: OCR bad</button>
          <button id="toggleMd">Toggle Original/Translated</button>
          <button id="translateMd" style="background:#4CAF50; color:white; display:none;">🌐 翻译为中文</button>
          <span id="translateStatus" style="color:#666; font-size:12px;"></span>
        </div>
      </div>
      <div class="card">
        <h3>Parsed Results</h3>
        <div class="content parsed" id="parsedBox"></div>
        <div style="padding:8px; display:flex; gap:8px;">
          <button data-issue="json-wrong-years">Mark: Wrong work years</button>
          <button data-issue="json-missing-fields">Mark: Missing fields</button>
          <button data-issue="json-wrong-schools">Mark: Wrong schools</button>
        </div>
      </div>
    </div>
  </div>

<script>
let index = null;
let items = [];
let current = null;
let showTranslated = true;
let issues = {}; // { stem: [ {type, note, ts} ] }

async function loadIndex() {
  const res = await fetch('./index.json?_=' + Date.now());
  index = await res.json();
  items = index.items || [];
  renderList();
}

function rel(path) { return path; }

function renderList() {
  const filter = document.getElementById('filter').value;
  const list = document.getElementById('list');
  list.innerHTML = '';
  const filtered = items.filter(it => {
    if (filter === 'need_translate') return it.md && !it.md_zh; // 有原文但没有译文
    if (filter === 'nojson') return !it.json;
    if (filter === 'noocr') return !it.md;
    if (filter === 'haszh') return !!it.md_zh;
    return true;
  });
  
  // 显示筛选结果统计
  const header = document.querySelector('header .toolbar');
  let statsSpan = document.getElementById('filterStats');
  if (!statsSpan) {
    statsSpan = document.createElement('span');
    statsSpan.id = 'filterStats';
    statsSpan.style.cssText = 'margin-left:10px; color:#666; font-size:12px;';
    header.appendChild(statsSpan);
  }
  statsSpan.textContent = `(${filtered.length}/${items.length})`;
  
  for (const it of filtered) {
    const div = document.createElement('div');
    div.className = 'item' + (current && current.stem === it.stem ? ' active' : '');
    
    // 添加状态指示器
    let statusIcon = '';
    if (it.md && !it.md_zh) {
      statusIcon = '⚠️ '; // 需要翻译
    } else if (it.md_zh) {
      statusIcon = '✅ '; // 已翻译
    }
    
    div.textContent = statusIcon + it.stem;
    div.onclick = () => selectItem(it);
    list.appendChild(div);
  }
}

async function fetchText(path) {
  try {
    const res = await fetch(path);
    return await res.text();
  } catch (e) {
    return '';
  }
}

function renderMarkdown(text) {
  const mdBox = document.getElementById('mdBox');
  if (window.marked) {
    try {
      mdBox.innerHTML = marked.parse(text || '');
      return;
    } catch (e) {
      // fallthrough
    }
  }
  mdBox.textContent = text || '';
}

function esc(s) { return (s==null?'':String(s)); }
function joinArr(a, n=50) { return Array.isArray(a) ? a.slice(0,n).join(', ') : ''; }
function briefList(a, n=3, maxLen=120) {
  if (!Array.isArray(a) || a.length===0) return '<em>None</em>';
  const out=[];
  for (let i=0;i<Math.min(a.length,n);i++) {
    let t = String(a[i]||'');
    if (t.length>maxLen) t = t.slice(0,maxLen)+'...';
    out.push(`<li>${t.replace(/</g,'&lt;').replace(/>/g,'&gt;')}</li>`);
  }
  if (a.length>n) out.push(`<li>... (${a.length - n} more)</li>`);
  return `<ul class="list">${out.join('')}</ul>`;
}

function renderParsed(result) {
  const box = document.getElementById('parsedBox');
  if (!result) { box.innerHTML = 'No parsed result.'; return; }
  const name = esc(result.name);
  const email = esc(result.email);
  const phone = esc(result.phone);
  const degree = esc(result.education_degree);
  const major = esc(result.education_major);
  const schools = joinArr(result.education_school);
  const tiers = joinArr(result.education_tiers);
  const workYears = result.work_years!=null ? String(result.work_years)+' 年' : '未知';
  const category = esc(result.category);
  const skills = joinArr(result.skills, 50);
  const selfEval = esc(result.self_evaluation_zh || result.self_evaluation || '');

  const workList = briefList(result.work_experience_zh || result.work_experience);
  const projList = briefList(result.project_experience_zh || result.project_experience);

  box.innerHTML = `
    <div class="kv">
      <div class="k">姓名</div><div>${name||'<em>未知</em>'}</div>
      <div class="k">邮箱</div><div>${email||'<em>无</em>'}</div>
      <div class="k">电话</div><div>${phone||'<em>无</em>'}</div>
      <div class="k">学历</div><div>${degree||'<em>未知</em>'}</div>
      <div class="k">专业</div><div>${major||'<em>未知</em>'}</div>
      <div class="k">学校</div><div>${schools||'<em>无</em>'}</div>
      <div class="k">学校层次</div><div>${tiers||'<em>无</em>'}</div>
      <div class="k">工作年限</div><div>${workYears}</div>
      <div class="k">类别</div><div>${category||'<em>未知</em>'}</div>
      <div class="k">技能</div><div>${skills||'<em>无</em>'}</div>
      <div class="k">自我评价</div><div>${selfEval||'<em>无</em>'}</div>
    </div>
    <h4 style="margin-top:10px; font-size: 12px;">工作经历</h4>
    ${workList}
    <h4 style="margin-top:10px; font-size: 12px;">项目经历</h4>
    ${projList}
  `;
}

async function selectItem(it) {
  current = it;
  renderList();
  
  // PDF
  const pdfFrame = document.getElementById('pdfFrame');
  pdfFrame.src = it.pdf ? it.pdf : 'about:blank';

  // Markdown - 智能显示翻译按钮
  const translateBtn = document.getElementById('translateMd');
  const mdStatus = document.getElementById('mdStatus');
  const translateStatus = document.getElementById('translateStatus');
  
  translateStatus.textContent = '';
  
  // 检查是否有原文和译文
  const hasOriginal = !!it.md;
  const hasTranslated = !!it.md_zh;
  
  if (!hasOriginal) {
    // 没有 Markdown 文件
    translateBtn.style.display = 'none';
    mdStatus.textContent = '';
    mdStatus.style.color = '#999';
  } else if (hasTranslated) {
    // 已有译文
    translateBtn.style.display = 'none';
    mdStatus.textContent = showTranslated ? '(中文版)' : '(英文版)';
    mdStatus.style.color = showTranslated ? '#4CAF50' : '#2196F3';
  } else {
    // 有原文但没有译文 - 显示翻译按钮
    translateBtn.style.display = 'inline-block';
    mdStatus.textContent = '(未翻译)';
    mdStatus.style.color = '#FF9800';
    translateStatus.textContent = '👈 点击翻译按钮生成中文版';
    translateStatus.style.color = '#FF9800';
  }
  
  let mdPath = (showTranslated && it.md_zh) ? it.md_zh : (it.md || it.md_input || '');
  // 统一成以斜杠开头，确保从站点根读取
  if (mdPath && !mdPath.startsWith('/')) mdPath = '/' + mdPath;
  const mdText = mdPath ? await fetchText(mdPath) : 'No markdown available.';
  renderMarkdown(mdText);

  // Parsed results
  if (it.json) {
    try {
      const txt = await fetchText(it.json);
      const obj = JSON.parse(txt);
      renderParsed(obj.result || null);
    } catch(e) {
      document.getElementById('parsedBox').textContent = 'Failed to load parsed result.';
    }
  } else {
    document.getElementById('parsedBox').textContent = 'No parsed result.';
  }
}

function addIssue(type) {
  if (!current) return;
  const note = prompt('Note (optional):') || '';
  const ts = new Date().toISOString();
  issues[current.stem] = issues[current.stem] || [];
  issues[current.stem].push({ type, note, ts });
  alert('Marked. Use Export Issues to download JSON.');
}

function exportIssues() {
  const blob = new Blob([JSON.stringify(issues, null, 2)], {type: 'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'issues.json';
  a.click();
}

function importIssues(file) {
  const reader = new FileReader();
  reader.onload = () => {
    try {
      issues = JSON.parse(reader.result);
      alert('Issues loaded.');
    } catch(e) { alert('Invalid JSON.'); }
  };
  reader.readAsText(file);
}

async function translateCurrent() {
  if (!current) {
    alert('请先选择一个文件');
    return;
  }
  
  if (!current.md) {
    alert('当前文件没有 Markdown 版本');
    return;
  }
  
  const btn = document.getElementById('translateMd');
  const translateStatus = document.getElementById('translateStatus');
  const originalText = btn.textContent;
  const originalStatusText = translateStatus.textContent;
  
  try {
    btn.disabled = true;
    btn.textContent = '⏳ 翻译中...';
    translateStatus.textContent = '正在分段翻译，请稍候（约20-60秒）...';
    translateStatus.style.color = '#2196F3';
    
    // 调用同域 API（集成到 FastAPI:8000）
    const response = await fetch('/api/test_parser/translate_file', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        file_path: current.md
      })
    });
    
    const result = await response.json();
    
    if (result.success) {
      translateStatus.textContent = '✅ 翻译成功！';
      translateStatus.style.color = '#4CAF50';

      // 直接使用返回的译文路径，立即呈现
      const zhPath = (result.output_path || '').startsWith('/') ? result.output_path : ('/' + (result.output_path || ''));
      if (zhPath) {
        // 更新当前项并强制展示中文
        current = Object.assign({}, current, { md_zh: zhPath });
        showTranslated = true;
        await selectItem(current);
      }

      // 异步刷新索引（不阻塞显示），让左侧列表状态也更新
      loadIndex();

      // 提示段落数
      setTimeout(() => {
        const msg = document.getElementById('translateStatus');
        msg.textContent = `✅ 已翻译 ${result.sections_count} 个段落`;
        msg.style.color = '#4CAF50';
      }, 300);
      
    } else {
      translateStatus.textContent = `❌ 翻译失败：${result.error}`;
      translateStatus.style.color = '#f44336';
      alert(`❌ 翻译失败：${result.error}`);
      console.error('翻译错误:', result);
    }
  } catch (error) {
    translateStatus.textContent = '❌ 翻译失败';
    translateStatus.style.color = '#f44336';
    alert(`❌ ${error.message}`);
    console.error('翻译请求错误:', error);
  } finally {
    btn.disabled = false;
    btn.textContent = originalText;
  }
}

document.getElementById('refresh').onclick = loadIndex;
document.getElementById('filter').onchange = renderList;
document.getElementById('exportIssues').onclick = exportIssues;
document.getElementById('importIssues').onchange = (e)=>{
  if (e.target.files && e.target.files[0]) importIssues(e.target.files[0]);
};
document.getElementById('toggleMd').onclick = ()=>{ showTranslated = !showTranslated; if (current) selectItem(current); };
document.getElementById('translateMd').onclick = translateCurrent;

document.querySelectorAll('button[data-issue]').forEach(btn=>{
  btn.onclick = ()=> addIssue(btn.getAttribute('data-issue'));
});

loadIndex();
</script>
</body>
</html>
